name: pack

on:
  push:
    branches: [main, 'port/neoforge-1.21.1']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and update in an isolated Windows fixture
        shell: powershell
        run: ./tests/install-windows.ps1
  pack:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest
        run: python3 -c "import json; m = json.load(open('modpack-neoforge-1.21.1.json')); assert m['mods'], 'no mods'; print(len(m['mods']), 'mods')"
      - name: Check every Modrinth file against its checksum
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          for mod in json.load(open('modpack-neoforge-1.21.1.json'))['mods']:
              if 'url' in mod:
                  data = urllib.request.urlopen(urllib.request.Request(mod['url'], headers={'User-Agent': 'euf-modpack-ci'})).read()
                  assert hashlib.sha512(data).hexdigest() == mod['sha512'], mod['name'] + ': checksum mismatch'
                  print(mod['name'], 'ok')
          PY
      - name: Validate PowerShell and directory protection
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'installer-safety'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $rejected = $false
          try { & ./install.ps1 -GameDir (Join-Path $env:APPDATA '.minecraft') } catch {
            if ($_.Exception.Message -notlike 'Use only *') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Original game directory was accepted' }
          if (Test-Path (Join-Path $env:APPDATA '.minecraft')) { throw 'Original directory was touched' }
          # Run the actual guard with the allowed path, without starting downloads.
          $prefix = (Get-Content ./install.ps1 -Raw).Split('$ProgressPreference')[0]
          $guard = [scriptblock]::Create($prefix)
          $allowed = Join-Path $env:APPDATA '.minecraft-codex-neoforge-1.21.1'
          & $guard -GameDir $allowed
          New-Item -ItemType Directory -Force $allowed | Out-Null
          $target = Join-Path $env:APPDATA 'original-game'
          New-Item -ItemType Directory -Force $target | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $allowed 'mods') -Target $target | Out-Null
          # Append a check of the final mods path to the same script scope.
          $linkedGuard = [scriptblock]::Create($prefix + "`n" + 'Assert-IsolatedPath (Join-Path $GameDir "mods")')
          $rejected = $false
          try { & $linkedGuard -GameDir $allowed } catch {
            if ($_.Exception.Message -notlike 'Linked directories are not allowed:*') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Linked mods directory was accepted' }
      - name: Build the installer zip
        run: zip -j euf-modpack-neoforge-1.21.1.zip install-modpack.bat install.ps1 modpack-neoforge-1.21.1.json README.md CODEX.md
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-installer
          path: euf-modpack-neoforge-1.21.1.zip
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pack-neoforge -y --cleanup-tag || true
          gh release create pack-neoforge euf-modpack-neoforge-1.21.1.zip --title "Сборка euf — Codex (отдельная папка игры)" --latest \
            --notes "Установщик сборки: распакуй и запусти install-modpack.bat. Моды: $(python3 -c "import json; print(', '.join(m['name'] for m in json.load(open('modpack-neoforge-1.21.1.json'))['mods']))")."
